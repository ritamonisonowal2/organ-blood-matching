<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Reset — LifeLink</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme-editorial.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card" style="text-align:center">
      <h1>Reset this browser</h1>
      <p class="auth-sub">Deletes every account, donor, request, donation and stock record saved in this browser
        and returns LifeLink to a clean, empty platform. This cannot be undone.</p>
      <button class="btn btn-primary btn-block" id="go">Delete everything and start fresh</button>
      <div class="auth-foot"><a href="index.html">Cancel — back to home</a></div>
    </div>
  </main>
  <script>
    document.getElementById('go').addEventListener('click', () => {
      ['lifelink_db_v1','lifelink_schema_version','lifelink_session'].forEach(k => {
        try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {}
      });
      location.href = 'index.html';
    });
  </script>
</body>
</html>
